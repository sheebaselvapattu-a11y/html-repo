name: HTML Demo Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  html-validation:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout repository
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Step 2: Start Message
    - name: Start Validation
      run: echo "Checking HTML structure and closing tags..."

    # Step 3: Check if index.html exists
    - name: Check index.html File
      run: |
        if [ ! -f index.html ]; then
          echo "ERROR: index.html file is missing!"
          exit 1
        fi

    # Step 4: Check opening and closing tags
    - name: Validate Opening and Closing Tags
      run: |
        check_tag() {
          OPEN_COUNT=$(grep -o "<$1[^>]*>" index.html | wc -l)
          CLOSE_COUNT=$(grep -o "</$1>" index.html | wc -l)

          if [ "$OPEN_COUNT" -ne "$CLOSE_COUNT" ]; then
            echo "ERROR: <$1> tag mismatch! Opening tags: $OPEN_COUNT, Closing tags: $CLOSE_COUNT"
            exit 1
          else
            echo "SUCCESS: <$1> tag is properly closed."
          fi
        }

        check_tag html
        check_tag head
        check_tag body
        check_tag title
        check_tag h1
        check_tag p
        check_tag div
        check_tag section
        check_tag footer

    # Step 5: Check if DOCTYPE exists
    - name: Validate DOCTYPE
      run: |
        if ! grep -q "<!DOCTYPE html>" index.html; then
          echo "ERROR: Missing <!DOCTYPE html> declaration!"
          exit 1
        else
          echo "SUCCESS: DOCTYPE found."
        fi

    # Step 6: Final Success
    - name: Validation Passed
      run: echo "HTML validation successful! All checked tags are properly closed."
